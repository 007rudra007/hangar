name: hangar
description: "Hangar - A local-first smart wardrobe and virtual try-on Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  dynamic_color: ^1.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  http: ^1.2.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  image: ^4.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/images/
    - assets/design/design_tokens.json
